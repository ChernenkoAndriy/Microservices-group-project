server:
  port: ${SERVER_PORT:8083}

spring:
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: streaming-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/spotty_streaming_db}
    username: ${SPRING_DATASOURCE_USERNAME:spotty_streaming_user}
    password: ${SPRING_DATASOURCE_PASSWORD:your_secure_streaming_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    # PRODUCER span per record and traceparent in its headers (W3C Trace Context over Kafka).
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Idempotent producer: a retried send never writes the same record twice to a partition.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Fail fast while Kafka is down; the event stays in the outbox and the relay tries again.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

events:
  topics:
    asset-ready: streaming.asset.ready
    partitions: 3

outbox:
  relay:
    poll-interval-ms: 1000
    batch-size: 50
    send-timeout-ms: 10000

transcoding:
  worker:
    poll-interval-ms: 2000
    # Pretend transcoding takes this long, to see spotty_transcoding_active_seconds in Prometheus.
    simulated-delay-ms: ${TRANSCODING_SIMULATED_DELAY_MS:0}

# GET /internal/tracks/{trackId} before an upload: the track exists and belongs to the caller.
catalog-client:
  base-url: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
  internal-token: ${INTERNAL_API_TOKEN:dev-internal-token}
  connect-timeout: 1s
  read-timeout: 2s

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://media-storage:9000}
    access-key: ${S3_ACCESS_KEY:any_user}
    secret-key: ${S3_SECRET_KEY:any_password}
    bucket-name: ${S3_BUCKET_NAME:tracks}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  # Every trace is recorded; the OpenTelemetry Collector keeps errors and slow traces (tail sampling).
  # Spans are exported only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (k8s manifests).
  tracing:
    sampling:
      probability: 1.0
  # Metrics stay with Prometheus (scraped from /actuator/prometheus); the OpenTelemetry starter would also push them.
  otlp:
    metrics:
      export:
        enabled: false
  observations:
    annotations:
      enabled: true
    # The worker and the relay poll every 1-2 s; a trace per empty poll is noise. Their real work
    # continues the trace stored with the job and the outbox row (TraceContextCarrier).
    enable:
      tasks.scheduled: false
