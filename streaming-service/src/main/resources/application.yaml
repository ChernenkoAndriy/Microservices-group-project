server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: streaming-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

minio:
  endpoint: ${S3_ENDPOINT:http://media-storage:9000}
  access-key: ${S3_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}
  secret-key: ${S3_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadmin}}
  bucket-name: ${MINIO_BUCKET_NAME:tracks}