server:
  port: ${SERVER_PORT:8083}

spring:
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: streaming-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://media-storage:9000}
    access-key: ${S3_ACCESS_KEY:any_user}
    secret-key: ${S3_SECRET_KEY:any_password}
    bucket-name: ${S3_BUCKET_NAME:tracks}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
