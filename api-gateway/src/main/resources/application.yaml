server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: tracks
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tracks/**
            - id: library
              uri: ${LIBRARY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/library/**
            - id: streaming
              uri: ${STREAMING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/streaming/**
            - id: recommendations
              uri: ${RECOMMENDATIONS_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/recommendations/**
            - id: notifications
              uri: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/notifications/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

