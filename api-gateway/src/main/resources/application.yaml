server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: admin-users
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/users/**
            - id: admin-notifications
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/admin/notifications/**,/api/v1/admin/notification-templates/**
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: tracks
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tracks/**,/api/v1/artists/**,/api/v1/albums/**,/api/v1/genres/**
            - id: library
              uri: ${LIBRARY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/library/**
            - id: streaming
              uri: ${STREAMING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/streaming/**,/api/v1/media/**
            - id: recommendations
              uri: ${RECOMMENDATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/recommendations/**,/api/v1/analytics/**,/api/v1/charts/**
            - id: notifications
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/notifications/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
