server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Admin routes are split by owning service and listed before the general routes.
            # The admin role is not enforced here yet.
            - id: admin-users
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/users/**
            - id: admin-notifications
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/admin/notifications/**,/api/v1/admin/notification-templates/**
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: tracks
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tracks/**
            - id: library
              uri: ${LIBRARY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/library/**
            - id: streaming
              uri: ${STREAMING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/streaming/**
            - id: recommendations
              uri: ${RECOMMENDATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/recommendations/**
            - id: notifications
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/notifications/**
jwt:
  # Must be the same Base64-encoded HMAC key auth-service signs tokens with (same env var as auth-service).
  secret: ${AUTH_SERVICE_JWT_SECRET:c3BvdHR5LWF1dGgtc2VydmljZS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtcGxlYXNl}

gateway:
  security:
    # Deny by default: every request needs a valid JWT except the endpoints listed here
    # (see API_GATEWAY_ENDPOINTS.md). Omit `method` to allow any method.
    public-endpoints:
      - method: POST
        paths:
          - /api/v1/auth/register
          - /api/v1/auth/login
          - /api/v1/auth/refresh
      - method: GET
        paths:
          - /api/v1/tracks
          - /api/v1/tracks/{id}
          - /api/v1/artists/{id}
          - /api/v1/artists/{id}/tracks
          - /api/v1/artists/{id}/albums
          - /api/v1/albums/{id}
          - /api/v1/genres
          - /api/v1/charts/top
          # Protected by a signed stream token that streaming-service checks, not by the JWT.
          - /api/v1/streaming/{trackId}
          - /actuator/health/**
          - /actuator/info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
