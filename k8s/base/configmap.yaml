apiVersion: v1
kind: ConfigMap
metadata:
  name: spotty-config
data:
  AUTH_DB_NAME: "spotty_auth_db"
  AUTH_DB_USER: "spotty_auth_user"
  AUTH_DB_PORT: "5432"
  AUTH_DB_HOST: "auth-db"
  SPRING_DATASOURCE_AUTH_URL: "jdbc:postgresql://auth-db:5432/spotty_auth_db"

  CATALOG_DB_NAME: "spotty_catalog_db"
  CATALOG_DB_USER: "spotty_catalog_user"
  CATALOG_DB_PORT: "5432"
  CATALOG_DB_HOST: "catalog-db"
  SPRING_DATASOURCE_CATALOG_URL: "jdbc:postgresql://catalog-db:5432/spotty_catalog_db"

  NOTIFICATION_DB_NAME: "spotty_notification_db"
  NOTIFICATION_DB_USER: "spotty_notification_user"
  NOTIFICATION_DB_PORT: "5432"
  NOTIFICATION_DB_HOST: "notification-db"
  SPRING_DATASOURCE_NOTIFICATION_URL: "jdbc:postgresql://notification-db:5432/spotty_notification_db"

  CLICKHOUSE_DB: "spotty_analytics_db"
  CLICKHOUSE_USER: "spotty_clickhouse_user"
  CLICKHOUSE_HTTP_PORT: "8123"
  CLICKHOUSE_HOST: "recommendation-db"
  CLICKHOUSE_URL: "jdbc:ch:http://recommendation-db:8123/spotty_analytics_db?compress=0"

  MINIO_ROOT_USER: "spotty_minio_admin"
  MINIO_ENDPOINT: "http://media-storage:9000"
  MINIO_BUCKET_NAME: "tracks"

  AUTH_SERVICE_PORT: "8081"
  CATALOG_SERVICE_PORT: "8082"
  STREAMING_SERVICE_PORT: "8083"
  RECOMMENDATION_SERVICE_PORT: "8084"
  NOTIFICATION_SERVICE_PORT: "8085"
  GATEWAY_PORT: "8080"

  AUTH_SERVICE_URL: "http://auth-service:8081"
  CATALOG_SERVICE_URL: "http://catalog-service:8082"
  STREAMING_SERVICE_URL: "http://streaming-service:8083"
  RECOMMENDATION_SERVICE_URL: "http://recommendation-service:8084"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8085"

  S3_ENDPOINT: "http://media-storage:9000"
  S3_BUCKET_NAME: "tracks"