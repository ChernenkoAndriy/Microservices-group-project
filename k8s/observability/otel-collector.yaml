# OpenTelemetry Collector for traces. The services send spans over OTLP to otel-collector:4317 (gRPC) or
# otel-collector:4318 (HTTP, path /v1/traces). The collector keeps whole traces by tail sampling and exports
# them to Tempo.
#
# Tail sampling decides per trace, so every span of a trace has to reach the same collector instance:
# keep replicas at 1 (more replicas would need a loadbalancing exporter in front, routing by trace id).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

      filter/actuator:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(name, "(?i)actuator")'
            - 'IsMatch(attributes["uri"], "^/actuator")'
            - 'IsMatch(attributes["http.route"], "^/actuator")'
            - 'IsMatch(attributes["url.path"], "^/actuator")'

      tail_sampling:
        decision_wait: 10s
        num_traces: 20000
        expected_new_traces_per_sec: 50
        decision_cache:
          sampled_cache_size: 20000
          non_sampled_cache_size: 20000
        policies:
          # 1. Every trace with at least one span in status ERROR.
          - name: keep-errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          # 2. Slow traces.
          - name: keep-slow
            type: latency
            latency:
              threshold_ms: 1000
          # 3. A share of the remaining, successful traces.
          - name: sample-ok
            type: probabilistic
            probabilistic:
              sampling_percentage: 25

      batch:
        send_batch_size: 512
        timeout: 2s

    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/actuator, tail_sampling, batch]
          exporters: [otlp/tempo, debug]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        # otelcol_processor_tail_sampling_* metrics show how many traces were kept or dropped and why
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.135.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics
            - containerPort: 13133
              name: health
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - port: 4317
      targetPort: otlp-grpc
      name: otlp-grpc
    - port: 4318
      targetPort: otlp-http
      name: otlp-http
    - port: 8888
      targetPort: metrics
      name: metrics
