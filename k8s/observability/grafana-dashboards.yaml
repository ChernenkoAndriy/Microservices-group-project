# Grafana dashboard "Spotty: огляд мікросервісів" (uid spotty-overview), provisioned from this ConfigMap:
# HTTP RED metrics per service, the custom Micrometer business metrics (spotty_*), Resilience4j circuit
# breakers, the gateway rate limiter (429) and JVM. Mounted by grafana.yaml; edit the JSON here, not in the UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: spotty
        folder: Spotty
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
  spotty-overview.json: |
    {
      "uid": "spotty-overview",
      "title": "Spotty: огляд мікросервісів",
      "tags": [
        "spotty"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "title": "Огляд системи",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Сервіси UP",
          "description": "Скільки подів сервісів Prometheus бачить живими",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 2,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(up{job=\"spotty-services\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Запитів/с (усі сервіси)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 3,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
