apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-service
  labels:
    app: streaming-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streaming-service
  template:
    metadata:
      labels:
        app: streaming-service
    spec:
      containers:
        - name: streaming-service
          image: streaming-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: spotty-config
                  key: STREAMING_SERVICE_PORT
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: spotty-config
                  key: MINIO_ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                configMapKeyRef:
                  name: spotty-config
                  key: MINIO_ROOT_USER
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spotty-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: spotty-config
                  key: MINIO_BUCKET_NAME
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
  labels:
    app: streaming-service
spec:
  type: ClusterIP
  selector:
    app: streaming-service
  ports:
    - port: 8083
      targetPort: 8083
      name: http