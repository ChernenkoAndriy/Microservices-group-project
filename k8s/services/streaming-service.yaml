apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-service
  labels:
    app: streaming-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streaming-service
  template:
    metadata:
      labels:
        app: streaming-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
        - name: streaming-service
          image: streaming-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: spotty-config
                  key: STREAMING_SERVICE_PORT
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: spotty-config
                  key: S3_ENDPOINT
            - name: S3_ACCESS_KEY
              value: "any_user"
            - name: S3_SECRET_KEY
              value: "any_password"
            - name: S3_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: spotty-config
                  key: S3_BUCKET_NAME
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: spotty-config
                  key: SPRING_DATASOURCE_STREAMING_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: spotty-config
                  key: STREAMING_DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spotty-secrets
                  key: STREAMING_DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: spotty-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
  labels:
    app: streaming-service
spec:
  type: ClusterIP
  selector:
    app: streaming-service
  ports:
    - port: 8083
      targetPort: http
      name: http