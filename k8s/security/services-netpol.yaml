apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-business-services
  labels:
    app.kubernetes.io/part-of: spotty
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - auth-service
          - catalog-service
          - streaming-service
          - recommendation-service
          - notification-service
          - library-service
  policyTypes:
    - Ingress
  ingress:
    # 1. Allow traffic strictly from API Gateway (app: api-gateway)
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
    # 2. Allow Prometheus to scrape metrics (/actuator/prometheus)
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
---
# Synchronous calls into catalog-service, each caller only on the port it uses:
# - streaming-service: gRPC CatalogInternalService on 9090 (track ownership and playability)
# - library-service: GET /internal/tracks/{id} on 8082 (a liked / playlisted track must exist)
# - notification-service: artist lookup on 8082 (follower release emails)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-streaming-to-catalog
  labels:
    app.kubernetes.io/part-of: spotty
spec:
  podSelector:
    matchLabels:
      app: catalog-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: streaming-service
      ports:
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 9090
    - from:
        - podSelector:
            matchLabels:
              app: library-service
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - protocol: TCP
          port: 8082
---
# catalog-service and library-service make synchronous HTTP calls to auth-service (GET /internal/users?ids=)
# to resolve artist names.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-catalog-to-auth
  labels:
    app.kubernetes.io/part-of: spotty
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: catalog-service
        - podSelector:
            matchLabels:
              app: library-service
      ports:
        - protocol: TCP
          port: 8081
