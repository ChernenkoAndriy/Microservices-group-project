# NetworkPolicies for Shared Infrastructure (Kafka, Monitoring, Tracing, Logging)
# Prevents Default Deny from breaking internal async messaging and observability.

# 1. Kafka: allow strictly the microservices that produce/consume messages, plus internal KRaft controller traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka
  labels:
    app.kubernetes.io/part-of: spotty
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - auth-service
                  - catalog-service
                  - streaming-service
                  - notification-service
      ports:
        - protocol: TCP
          port: 9092
    # Internal Kafka broker/controller replication & KRaft quorum
    - from:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
---
# 2. OpenTelemetry Collector: allow any service to export traces over OTLP (4317 gRPC, 4318 HTTP)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-collector
  labels:
    app.kubernetes.io/part-of: spotty
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 13133
---
# 3. Tempo: allow collector to export traces and Grafana to query them
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tempo
  labels:
    app.kubernetes.io/part-of: spotty
spec:
  podSelector:
    matchLabels:
      app: tempo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: otel-collector
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 4317
---
# 4. Loki: allow otel-collector-logs to push logs and Grafana to query them
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loki
  labels:
    app.kubernetes.io/part-of: spotty
spec:
  podSelector:
    matchLabels:
      app: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: otel-collector-logs
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 3100
---
# 5. Monitoring & Dashboard UIs (Prometheus, Alertmanager, Grafana)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-ui
  labels:
    app.kubernetes.io/part-of: spotty
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - prometheus
          - alertmanager
          - grafana
  policyTypes:
    - Ingress
  ingress:
    # Allow NodePort and inter-dashboard connections
    - ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 3000
---
# 6. Webhook Receiver: receives firing alerts POSTed from Alertmanager
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-receiver
  labels:
    app.kubernetes.io/part-of: spotty
spec:
  podSelector:
    matchLabels:
      app: webhook-receiver
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - protocol: TCP
          port: 8080
