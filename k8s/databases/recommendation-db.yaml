apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recommendation-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-db
  labels:
    app: recommendation-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: recommendation-db
  template:
    metadata:
      labels:
        app: recommendation-db
    spec:
      # uid/gid 101 = user clickhouse in the image. The entrypoint writes the CLICKHOUSE_USER config into users.d.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: clickhouse/clickhouse-server:26.10.3.7
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          env:
            - name: CLICKHOUSE_DB
              valueFrom:
                configMapKeyRef:
                  name: spotty-config
                  key: CLICKHOUSE_DB
            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: spotty-config
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spotty-secrets
                  key: CLICKHOUSE_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d
            - name: recommendation-db-storage
              mountPath: /var/lib/clickhouse
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
        - name: users-d
          emptyDir:
            sizeLimit: 1Mi
        - name: recommendation-db-storage
          persistentVolumeClaim:
            claimName: recommendation-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-db
  labels:
    app: recommendation-db
spec:
  type: ClusterIP
  selector:
    app: recommendation-db
  ports:
    - port: 8123
      targetPort: 8123
      name: http
    - port: 9000
      targetPort: 9000
      name: native