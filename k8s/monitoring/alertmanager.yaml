# Alertmanager receives alerts from Prometheus (alertmanager:9093) and POSTs them to webhook-receiver.
# UI: http://localhost:30093 (Docker Desktop). Delivered alerts: kubectl logs deploy/webhook-receiver
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    route:
      receiver: webhook
      group_by: [alertname, application]
      # Short timings so a test alert arrives quickly.
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h

    receivers:
      - name: webhook
        webhook_configs:
          - url: http://webhook-receiver:8080/alerts
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - containerPort: 9093
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels:
    app: alertmanager
spec:
  type: NodePort
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: http
      nodePort: 30093
      name: http
---
# Stand-in for a real notification channel: prints every webhook call it receives to its log.
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-receiver
  labels:
    app: webhook-receiver
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
            try:
                payload = json.loads(body)
                for alert in payload.get("alerts", []):
                    print(f"[{alert['status'].upper()}] {alert['labels'].get('alertname')} "
                          f"{alert['labels'].get('application', '')}: "
                          f"{alert.get('annotations', {}).get('summary', '')}", flush=True)
                print(json.dumps(payload, indent=2), flush=True)
            except ValueError:
                print(body.decode(errors="replace"), flush=True)
            self.send_response(200)
            self.end_headers()

        def do_GET(self):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")

        def log_message(self, format, *args):
            pass

    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  labels:
    app: webhook-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-receiver
  template:
    metadata:
      labels:
        app: webhook-receiver
    spec:
      containers:
        - name: webhook-receiver
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/server.py"]
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
      volumes:
        - name: app
          configMap:
            name: webhook-receiver
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
  labels:
    app: webhook-receiver
spec:
  selector:
    app: webhook-receiver
  ports:
    - port: 8080
      targetPort: http
      name: http
