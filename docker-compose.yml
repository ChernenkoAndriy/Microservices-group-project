services:
  # ============================================================================
  # СХОВИЩА ТА БАЗИ ДАНИХ (5 БАЗ ДАНИХ)
  # ============================================================================

  # 1. БД Auth (PostgreSQL)
  auth-db:
    image: postgres:17-alpine
    container_name: spotty-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    ports:
      - "${AUTH_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spotty-network

  # 2. БД Catalog (PostgreSQL)
  catalog-db:
    image: postgres:17-alpine
    container_name: spotty-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    ports:
      - "${CATALOG_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER} -d ${CATALOG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spotty-network

  # 3. Media Storage (MinIO S3)
  media-storage:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: spotty-media-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spotty-network

  # 4. БД Analytics / Recommendations (ClickHouse)
  recommendation-db:
    image: clickhouse/clickhouse-server:latest
    container_name: spotty-recommendation-db
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spotty-network

  # 5. БД Notifications & Queues (PostgreSQL)
  notification-db:
    image: postgres:17-alpine
    container_name: spotty-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    ports:
      - "${NOTIFICATION_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER} -d ${NOTIFICATION_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spotty-network

  # ============================================================================
  # СЕРВІСИ (6 СЕРВІСІВ)
  # ============================================================================

  # 1. Сервіс Auth (IAM)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: spotty-auth-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      SERVER_PORT: 8081
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - spotty-network

  # 2. Сервіс Catalog (Треки, Альбоми, Артисти)
  catalog-service:
    build:
      context: ./track-service
      dockerfile: Dockerfile
    container_name: spotty-catalog-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/${CATALOG_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${CATALOG_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${CATALOG_DB_PASSWORD}
      SERVER_PORT: 8082
    ports:
      - "${CATALOG_SERVICE_PORT:-8082}:8082"
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - spotty-network

  # 3. Сервіс Стрімінгу та доставки
  streaming-service:
    build:
      context: ./streaming-service
      dockerfile: Dockerfile
    container_name: spotty-streaming-service
    restart: unless-stopped
    environment:
      S3_ENDPOINT: http://media-storage:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SERVER_PORT: 8083
    ports:
      - "${STREAMING_SERVICE_PORT:-8083}:8083"
    depends_on:
      media-storage:
        condition: service_healthy
    networks:
      - spotty-network

  # 4. Сервіс Рекомендацій та Статистики
  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: spotty-recommendation-service
    restart: unless-stopped
    environment:
      CLICKHOUSE_URL: jdbc:ch://recommendation-db:8123/${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      SERVER_PORT: 8084
    ports:
      - "${RECOMMENDATION_SERVICE_PORT:-8084}:8084"
    depends_on:
      recommendation-db:
        condition: service_healthy
    networks:
      - spotty-network

  # 5. Сервіс Повідомлень
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: spotty-notification-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/${NOTIFICATION_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SERVER_PORT: 8085
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8085}:8085"
    depends_on:
      notification-db:
        condition: service_healthy
    networks:
      - spotty-network

  # 6. API Gateway (Центральна точка входу)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: spotty-api-gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      STREAMING_SERVICE_URL: http://streaming-service:8083
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      SERVER_PORT: 8080
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - auth-service
      - catalog-service
      - streaming-service
      - recommendation-service
      - notification-service
    networks:
      - spotty-network

# ============================================================================
# ТОМИ ТА МЕРЕЖА
# ============================================================================
volumes:
  auth_db_data:
  catalog_db_data:
  minio_data:
  clickhouse_data:
  notification_db_data:

networks:
  spotty-network:
    driver: bridge