services:

  auth-db:
    image: postgres:17-alpine
    container_name: spotty-auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    ports:
      - "${AUTH_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spotty-network

  catalog-db:
    image: postgres:17-alpine
    container_name: spotty-catalog-db
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    ports:
      - "${CATALOG_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER} -d ${CATALOG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spotty-network

  media-storage:
    image: chrislusf/seaweedfs:latest
    container_name: spotty-media-storage
    command: "server -dir=/data -s3 -s3.port=9000"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
    networks:
      - spotty-network

  recommendation-db:
    image: clickhouse/clickhouse-server:latest
    container_name: spotty-recommendation-db
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spotty-network

  notification-db:
    image: postgres:17-alpine
    container_name: spotty-notification-db
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    ports:
      - "${NOTIFICATION_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER} -d ${NOTIFICATION_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spotty-network

  library-db:
    image: postgres:17-alpine
    container_name: spotty-library-db
    environment:
      POSTGRES_DB: ${LIBRARY_DB_NAME}
      POSTGRES_USER: ${LIBRARY_DB_USER}
      POSTGRES_PASSWORD: ${LIBRARY_DB_PASSWORD}
    volumes:
      - library_db_data:/var/lib/postgresql/data
    ports:
      - "${LIBRARY_DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LIBRARY_DB_USER} -d ${LIBRARY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spotty-network

  streaming-db:
    image: postgres:17-alpine
    container_name: spotty-streaming-db
    environment:
      POSTGRES_DB: ${STREAMING_DB_NAME:-spotty_streaming_db}
      POSTGRES_USER: ${STREAMING_DB_USER:-spotty_streaming_user}
      POSTGRES_PASSWORD: ${STREAMING_DB_PASSWORD:-your_secure_streaming_password}
    volumes:
      - streaming_db_data:/var/lib/postgresql/data
    ports:
      - "${STREAMING_DB_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STREAMING_DB_USER:-spotty_streaming_user} -d ${STREAMING_DB_NAME:-spotty_streaming_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spotty-network

  # Single-node Kafka in KRaft mode. Containers use kafka:9092, the host uses localhost:9094.
  kafka:
    image: apache/kafka:3.9.1
    container_name: spotty-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - spotty-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: spotty-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: spotty
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - spotty-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ./api-contracts
    container_name: spotty-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      SERVER_PORT: 8081
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - spotty-network

  catalog-service:
    build:
      context: ./track-service
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ./api-contracts
    container_name: spotty-catalog-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/${CATALOG_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${CATALOG_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${CATALOG_DB_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8082
    ports:
      - "${CATALOG_SERVICE_PORT:-8082}:8082"
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - spotty-network

  streaming-service:
    build:
      context: ./streaming-service
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ./api-contracts
    container_name: spotty-streaming-service
    environment:
      S3_ENDPOINT: http://media-storage:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://streaming-db:5432/${STREAMING_DB_NAME:-spotty_streaming_db}
      SPRING_DATASOURCE_USERNAME: ${STREAMING_DB_USER:-spotty_streaming_user}
      SPRING_DATASOURCE_PASSWORD: ${STREAMING_DB_PASSWORD:-your_secure_streaming_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8083
    ports:
      - "${STREAMING_SERVICE_PORT:-8083}:8083"
    depends_on:
      media-storage:
        condition: service_started
      streaming-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - spotty-network

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ./api-contracts
    container_name: spotty-recommendation-service
    environment:
      CLICKHOUSE_URL: jdbc:ch://recommendation-db:8123/${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      SERVER_PORT: 8084
    ports:
      - "${RECOMMENDATION_SERVICE_PORT:-8084}:8084"
    depends_on:
      recommendation-db:
        condition: service_healthy
    networks:
      - spotty-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ./api-contracts
    container_name: spotty-notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/${NOTIFICATION_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SERVER_PORT: 8085
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8085}:8085"
    depends_on:
      notification-db:
        condition: service_healthy
    networks:
      - spotty-network

  library-service:
    build:
      context: ./library-service
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ./api-contracts
    container_name: spotty-library-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://library-db:5432/${LIBRARY_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${LIBRARY_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${LIBRARY_DB_PASSWORD}
      SERVER_PORT: 8086
    ports:
      - "${LIBRARY_SERVICE_PORT:-8086}:8086"
    depends_on:
      library-db:
        condition: service_healthy
    networks:
      - spotty-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: spotty-api-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      STREAMING_SERVICE_URL: http://streaming-service:8083
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      LIBRARY_SERVICE_URL: http://library-service:8086
      SERVER_PORT: 8080
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - auth-service
      - catalog-service
      - streaming-service
      - recommendation-service
      - notification-service
      - library-service
    networks:
      - spotty-network

volumes:
  auth_db_data:
  catalog_db_data:
  minio_data:
  clickhouse_data:
  notification_db_data:
  library_db_data:
  streaming_db_data:
  kafka_data:

networks:
  spotty-network:
    driver: bridge
