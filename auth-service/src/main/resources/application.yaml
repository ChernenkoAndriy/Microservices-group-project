server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: authentication-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    template:
      observation-enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}

internal-api:
  token: ${INTERNAL_API_TOKEN:dev-internal-token}

jwt:
  secret: ${AUTH_SERVICE_JWT_SECRET:c3BvdHR5LWF1dGgtc2VydmljZS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtcGxlYXNl}
  ttl: ${AUTH_SERVICE_JWT_TTL:10m}
  refresh-ttl: ${AUTH_SERVICE_JWT_REFRESH_TTL:30d}

logging:
  # One JSON object per line (logstash format) with the MDC values, so traceId and spanId are fields of every
  # record; otel-collector-logs (k8s/observability) parses them and Grafana links a span to its logs in Loki.
  structured:
    format:
      console: logstash
  pattern:
    correlation: "[%X{correlationId:-}] [%X{traceId:-},%X{spanId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  # Every trace is recorded; the OpenTelemetry Collector keeps errors and slow traces (tail sampling).
  # Spans are exported only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (k8s manifests).
  tracing:
    sampling:
      probability: 1.0
  # Metrics stay with Prometheus (scraped from /actuator/prometheus); the OpenTelemetry starter would also push them.
  otlp:
    metrics:
      export:
        enabled: false
  observations:
    annotations:
      enabled: true
    enable:
      tasks.scheduled: false
