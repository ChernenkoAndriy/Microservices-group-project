server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: authentication-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

internal-api:
  token: ${INTERNAL_API_TOKEN:dev-internal-token}

jwt:
  secret: ${AUTH_SERVICE_JWT_SECRET:c3BvdHR5LWF1dGgtc2VydmljZS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtcGxlYXNl}
  ttl: ${AUTH_SERVICE_JWT_TTL:10m}
  refresh-ttl: ${AUTH_SERVICE_JWT_REFRESH_TTL:30d}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
