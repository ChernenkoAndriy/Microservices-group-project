server:
  port: ${SERVER_PORT:8082}

spring:
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: track-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

internal-api:
  token: ${INTERNAL_API_TOKEN:dev-internal-token}

auth-client:
  base-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  internal-token: ${INTERNAL_API_TOKEN:dev-internal-token}
  connect-timeout: 1s
  read-timeout: 2s

# Applied to ArtistDirectory by @Retry -> @CircuitBreaker -> @Bulkhead (outermost first).
# Only 5xx and I/O errors count: a 4xx is neither retried nor recorded as a failure.
resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
  retry:
    instances:
      auth-service:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  bulkhead:
    instances:
      auth-service:
        max-concurrent-calls: 20
        max-wait-duration: 50ms

logging:
  pattern:
    correlation: "[%X{correlationId:-}] [%X{traceId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0
