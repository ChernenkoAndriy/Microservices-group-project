server:
  port: ${SERVER_PORT:8082}

spring:
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: track-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    # W3C Trace Context over Kafka: records forwarded to the retry and dead letter topics carry the trace on.
    template:
      observation-enabled: true
    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      isolation-level: read_committed
    producer:
      # Used by @RetryableTopic to forward failed records to the retry and dead letter topics.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      # The offset is committed only after the record was handled (or forwarded to a retry/dead letter topic).
      ack-mode: record
      # The listener continues the producer's trace from the traceparent header (CONSUMER span).
      observation-enabled: true

events:
  topics:
    asset-ready: streaming.asset.ready
    partitions: 3
  consumer:
    retry:
      attempts: 4
      delay-ms: 1000
      multiplier: 2
      max-delay-ms: 10000

internal-api:
  token: ${INTERNAL_API_TOKEN:dev-internal-token}

auth-client:
  base-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  internal-token: ${INTERNAL_API_TOKEN:dev-internal-token}
  connect-timeout: 1s
  read-timeout: 2s

# Applied to ArtistDirectory by @Retry -> @CircuitBreaker -> @Bulkhead (outermost first).
# Only 5xx and I/O errors count: a 4xx is neither retried nor recorded as a failure.
resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
  retry:
    instances:
      auth-service:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  bulkhead:
    instances:
      auth-service:
        max-concurrent-calls: 20
        max-wait-duration: 50ms

logging:
  # One JSON object per line (logstash format) with the MDC values, so traceId and spanId are fields of every
  # record; otel-collector-logs (k8s/observability) parses them and Grafana links a span to its logs in Loki.
  structured:
    format:
      console: logstash
  pattern:
    correlation: "[%X{correlationId:-}] [%X{traceId:-},%X{spanId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  # Every trace is recorded; the OpenTelemetry Collector keeps errors and slow traces (tail sampling).
  # Spans are exported only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (k8s manifests).
  tracing:
    sampling:
      probability: 1.0
  # Metrics stay with Prometheus (scraped from /actuator/prometheus); the OpenTelemetry starter would also push them.
  otlp:
    metrics:
      export:
        enabled: false
  observations:
    annotations:
      enabled: true
