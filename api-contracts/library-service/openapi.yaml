openapi: 3.0.3
info:
  title: Spotty Library Service API
  version: 1.0.0
  description: |
    User Library: the listener's own collection, i.e. liked tracks, followed artists and
    private playlists.

    Owned by **library-service** (port 8086). All paths are reached through the API gateway.
    Shared conventions are described in `api-contracts/README.md`.

    Responses contain ids only. Load track and artist details from the catalog service
    (`GET /api/v1/tracks?ids=...`, `GET /api/v1/artists/{artistId}`).

servers:
  - url: http://localhost:8080
    description: API gateway (local)

tags:
  - name: Likes
    description: Liked / favourite tracks (Scenario 2).
  - name: Follows
    description: Followed artists.
  - name: Playlists
    description: The user's own playlists. Private to their owner.

security:
  - bearerAuth: []

paths:
  /api/v1/library/likes:
    get:
      tags: [Likes]
      operationId: listMyLikes
      summary: My liked tracks
      description: Sorted by `likedAt`, newest first.
      parameters:
        - name: trackIds
          in: query
          required: false
          description: |
            Return only likes for these tracks, comma-separated. Use it to check which tracks in a
            list are liked.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            uniqueItems: true
            items:
              $ref: '../common/schemas.yaml#/Id'
        - $ref: '../common/parameters.yaml#/Page'
        - $ref: '../common/parameters.yaml#/Size'
      responses:
        '200':
          description: A page of likes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikePage'
        '400':
          $ref: '../common/responses.yaml#/BadRequest'
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'

  /api/v1/library/likes/{trackId}:
    parameters:
      - name: trackId
        in: path
        required: true
        schema:
          $ref: '../common/schemas.yaml#/Id'
    post:
      tags: [Likes]
      operationId: likeTrack
      summary: Like a track
      description: |
        Idempotent. A new like returns 201 and emits `TrackLikedEvent {userId, trackId, timestamp}`.
        Liking an already liked track returns 200 with the existing like and emits nothing.
      responses:
        '200':
          description: The track was already liked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Like'
        '201':
          description: Like created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Like'
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'
        '404':
          description: No published track with this id (`code` = `TRACK_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '../common/schemas.yaml#/ProblemDetail'
    delete:
      tags: [Likes]
      operationId: unlikeTrack
      summary: Remove a like
      description: |
        Idempotent. Emits `TrackUnlikedEvent` only if a like was actually removed;
        removing a missing like still returns 204.
      responses:
        '204':
          description: The track is not liked (any more).
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'

  /api/v1/library/follows:
    get:
      tags: [Follows]
      operationId: listMyFollows
      summary: Artists I follow
      description: Sorted by `followedAt`, newest first.
      parameters:
        - name: artistIds
          in: query
          required: false
          description: Return only follows for these artists, comma-separated.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            uniqueItems: true
            items:
              $ref: '../common/schemas.yaml#/Id'
        - $ref: '../common/parameters.yaml#/Page'
        - $ref: '../common/parameters.yaml#/Size'
      responses:
        '200':
          description: A page of follows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowPage'
        '400':
          $ref: '../common/responses.yaml#/BadRequest'
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'

  /api/v1/library/follows/{artistId}:
    parameters:
      - name: artistId
        in: path
        required: true
        schema:
          $ref: '../common/schemas.yaml#/Id'
    post:
      tags: [Follows]
      operationId: followArtist
      summary: Follow an artist
      description: |
        Idempotent. A new follow returns 201 and emits `ArtistFollowedEvent`; notification-service
        uses that event to keep its subscriber list for new-release emails (Scenario 1).
        Following an already followed artist returns 200 and emits nothing.
      responses:
        '200':
          description: The artist was already followed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Follow'
        '201':
          description: Follow created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Follow'
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'
        '404':
          description: No artist with this id (`code` = `ARTIST_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '../common/schemas.yaml#/ProblemDetail'
        '409':
          description: Artists cannot follow themselves (`code` = `SELF_FOLLOW_FORBIDDEN`).
          content:
            application/problem+json:
              schema:
                $ref: '../common/schemas.yaml#/ProblemDetail'
    delete:
      tags: [Follows]
      operationId: unfollowArtist
      summary: Unfollow an artist
      description: Idempotent. Emits `ArtistUnfollowedEvent` only if a follow was actually removed.
      responses:
        '204':
          description: The artist is not followed (any more).
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'

  /api/v1/library/playlists:
    get:
      tags: [Playlists]
      operationId: listMyPlaylists
      summary: My playlists
      description: Sorted by `updatedAt`, most recently changed first.
      parameters:
        - $ref: '../common/parameters.yaml#/Page'
        - $ref: '../common/parameters.yaml#/Size'
      responses:
        '200':
          description: A page of playlists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistSummaryPage'
        '400':
          $ref: '../common/responses.yaml#/BadRequest'
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'
    post:
      tags: [Playlists]
      operationId: createPlaylist
      summary: Create a playlist
      description: Creates an empty playlist owned by the caller. A user has at most 200 playlists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistRequest'
      responses:
        '201':
          description: Playlist created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '../common/responses.yaml#/BadRequest'
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'
        '409':
          description: The caller already has 200 playlists (`code` = `PLAYLIST_LIMIT_REACHED`).
          content:
            application/problem+json:
              schema:
                $ref: '../common/schemas.yaml#/ProblemDetail'

  /api/v1/library/playlists/{playlistId}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [Playlists]
      operationId: getPlaylist
      summary: A playlist with its tracks
      description: |
        Only the owner sees a playlist; anyone else gets 404 (`PLAYLIST_NOT_FOUND`).
        `tracks` holds track ids in playlist order; load the details from the catalog
        (`GET /api/v1/tracks?ids=...`).
      responses:
        '200':
          description: The playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'
        '404':
          $ref: '../common/responses.yaml#/NotFound'
    patch:
      tags: [Playlists]
      operationId: updatePlaylist
      summary: Rename a playlist or change its description
      description: Partial update; at least one field is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaylistRequest'
      responses:
        '200':
          description: The updated playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '../common/responses.yaml#/BadRequest'
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'
        '404':
          $ref: '../common/responses.yaml#/NotFound'
    delete:
      tags: [Playlists]
      operationId: deletePlaylist
      summary: Delete a playlist
      description: Idempotent for the owner; deleting a missing playlist still returns 204.
      responses:
        '204':
          description: The playlist does not exist (any more).
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'

  /api/v1/library/playlists/{playlistId}/tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
      - name: trackId
        in: path
        required: true
        schema:
          $ref: '../common/schemas.yaml#/Id'
    put:
      tags: [Playlists]
      operationId: addPlaylistTrack
      summary: Add a track to the end of a playlist
      description: |
        Idempotent: a track already on the playlist keeps its position. A playlist holds at most
        500 tracks. The track must be published (checked with catalog-service).
      responses:
        '200':
          description: The playlist with the track.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'
        '404':
          description: No such playlist of the caller (`PLAYLIST_NOT_FOUND`) or no published track (`TRACK_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '../common/schemas.yaml#/ProblemDetail'
        '409':
          description: The playlist already has 500 tracks (`code` = `PLAYLIST_FULL`).
          content:
            application/problem+json:
              schema:
                $ref: '../common/schemas.yaml#/ProblemDetail'
    delete:
      tags: [Playlists]
      operationId: removePlaylistTrack
      summary: Remove a track from a playlist
      description: Idempotent; the positions of the following tracks move up by one.
      responses:
        '204':
          description: The track is not on the playlist (any more).
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'
        '404':
          description: No such playlist of the caller (`PLAYLIST_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '../common/schemas.yaml#/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema:
        $ref: '../common/schemas.yaml#/Id'

  schemas:
    Like:
      type: object
      required:
        - trackId
        - likedAt
      properties:
        trackId:
          $ref: '../common/schemas.yaml#/Id'
        likedAt:
          type: string
          format: date-time

    LikePage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Like'
        page:
          $ref: '../common/schemas.yaml#/PageMetadata'

    Follow:
      type: object
      required:
        - artistId
        - followedAt
      properties:
        artistId:
          $ref: '../common/schemas.yaml#/Id'
        followedAt:
          type: string
          format: date-time

    FollowPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Follow'
        page:
          $ref: '../common/schemas.yaml#/PageMetadata'

    PlaylistName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^\S(?:.*\S)?$'
      example: Songs to cancel plans to

    PlaylistDescription:
      type: string
      maxLength: 500
      example: For when the bus is late and so are you.

    PlaylistTrack:
      type: object
      required:
        - trackId
        - position
        - addedAt
      properties:
        trackId:
          $ref: '../common/schemas.yaml#/Id'
        position:
          description: One-based position in the playlist.
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        addedAt:
          type: string
          format: date-time

    PlaylistSummary:
      type: object
      required:
        - id
        - name
        - trackCount
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '../common/schemas.yaml#/Id'
        name:
          $ref: '#/components/schemas/PlaylistName'
        description:
          $ref: '#/components/schemas/PlaylistDescription'
        trackCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlaylistSummaryPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PlaylistSummary'
        page:
          $ref: '../common/schemas.yaml#/PageMetadata'

    Playlist:
      type: object
      required:
        - id
        - name
        - trackCount
        - tracks
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '../common/schemas.yaml#/Id'
        name:
          $ref: '#/components/schemas/PlaylistName'
        description:
          $ref: '#/components/schemas/PlaylistDescription'
        trackCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 500
        tracks:
          description: Ordered by `position`.
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/PlaylistTrack'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePlaylistRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/PlaylistName'
        description:
          $ref: '#/components/schemas/PlaylistDescription'

    UpdatePlaylistRequest:
      description: At least one field must be present.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/PlaylistName'
        description:
          $ref: '#/components/schemas/PlaylistDescription'
