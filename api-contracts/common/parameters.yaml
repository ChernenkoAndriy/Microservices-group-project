# Shared query parameters. Reference them as: $ref: '../common/parameters.yaml#/<Name>'

Page:
  name: page
  in: query
  required: false
  description: Zero-based page index.
  schema:
    type: integer
    format: int32
    minimum: 0
    maximum: 10000
    default: 0

Size:
  name: size
  in: query
  required: false
  description: Number of items per page.
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 20
