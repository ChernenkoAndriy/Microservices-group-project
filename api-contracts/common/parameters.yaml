
Page:
  name: page
  in: query
  required: false
  description: Zero-based page index.
  schema:
    type: integer
    format: int32
    minimum: 0
    maximum: 10000
    default: 0

Size:
  name: size
  in: query
  required: false
  description: Number of items per page.
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100
    default: 20

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: false
  description: |
    Client-generated unique key (a UUID is recommended) that makes the POST safe to retry.
    A repeat with the same key and the same body returns the stored first response instead of
    performing the operation again. Reusing a key with a different body returns 422
    (`code` = `IDEMPOTENCY_KEY_REUSED`). Keys are kept for 24 hours.
  schema:
    type: string
    minLength: 1
    maxLength: 255
