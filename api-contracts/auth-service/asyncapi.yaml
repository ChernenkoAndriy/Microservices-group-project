asyncapi: 3.0.0
info:
  title: Spotty Auth Service Events
  version: 1.0.0
  description: |
    Kafka events published by auth-service (Identity & Access Management).
    Shared conventions (headers, keys, delivery guarantees) are in `api-contracts/README.md`.

defaultContentType: application/json

servers:
  kafka:
    host: kafka:9092
    protocol: kafka
    description: Kafka inside the compose network or the cluster

channels:
  userEmails:
    address: auth.user.email
    description: |
      Email delivery requests from auth-service. Each message asks notification-service to render
      a specific template and send it to the given address. Non-compacted: every message triggers
      exactly one email. Consumers: notification-service.
    messages:
      AuthEmailEvent:
        $ref: '#/components/messages/AuthEmailEvent'

  userSnapshots:
    address: auth.user.snapshot
    description: |
      Latest state of every user. Compacted, keyed by user id, so a new consumer can rebuild its copy
      by reading the topic from the start. Consumers: notification-service.
    messages:
      UserSnapshot:
        $ref: '#/components/messages/UserSnapshot'
    bindings:
      kafka:
        topicConfiguration:
          cleanup.policy: [compact]
        bindingVersion: 0.5.0

operations:
  publishAuthEmail:
    action: send
    channel:
      $ref: '#/channels/userEmails'
    summary: Sent when auth-service needs notification-service to email a user.
    messages:
      - $ref: '#/channels/userEmails/messages/AuthEmailEvent'

  publishUserSnapshot:
    action: send
    channel:
      $ref: '#/channels/userSnapshots'
    summary: Sent after registration, a profile update, and a role or status change by an admin.
    messages:
      - $ref: '#/channels/userSnapshots/messages/UserSnapshot'

components:
  messages:
    AuthEmailEvent:
      name: AuthEmailEvent
      title: Auth email request
      summary: Asks notification-service to send a templated email to a user. Key is `userId`.
      headers:
        $ref: '../common/events.yaml#/EventHeaders'
      payload:
        $ref: '#/components/schemas/AuthEmailEvent'
      bindings:
        kafka:
          key:
            $ref: '../common/events.yaml#/LongKey'
          bindingVersion: 0.5.0

    UserSnapshot:
      name: UserSnapshot
      title: User snapshot
      summary: The full current state of one user. Key is `userId`.
      headers:
        $ref: '../common/events.yaml#/EventHeaders'
      payload:
        $ref: '#/components/schemas/UserSnapshot'
      bindings:
        kafka:
          key:
            $ref: '../common/events.yaml#/LongKey'
          bindingVersion: 0.5.0

  schemas:
    AuthEmailEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - occurredAt
        - userId
        - to
        - template
        - variables
      properties:
        eventId:
          $ref: '../common/events.yaml#/EventId'
        occurredAt:
          $ref: '../common/events.yaml#/OccurredAt'
        userId:
          $ref: '../common/schemas.yaml#/Id'
        to:
          $ref: '../common/schemas.yaml#/Email'
        template:
          type: string
          enum:
            - WELCOME
            - ACCOUNT_BLOCKED
            - ACCOUNT_UNBLOCKED
          description: |
            WELCOME: sent after registration.
            ACCOUNT_BLOCKED: sent when an admin blocks the account.
            ACCOUNT_UNBLOCKED: sent when an admin restores the account.
        variables:
          type: object
          description: Template placeholder values, e.g. {"displayName":"Alex"}.
          additionalProperties:
            type: string
            maxLength: 500

    UserSnapshot:
      type: object
      additionalProperties: false
      required:
        - eventId
        - occurredAt
        - userId
        - email
        - role
        - status
      properties:
        eventId:
          $ref: '../common/events.yaml#/EventId'
        occurredAt:
          $ref: '../common/events.yaml#/OccurredAt'
        userId:
          $ref: '../common/schemas.yaml#/Id'
        email:
          $ref: '../common/schemas.yaml#/Email'
        role:
          $ref: './openapi.yaml#/components/schemas/UserRole'
        status:
          $ref: './openapi.yaml#/components/schemas/UserStatus'
