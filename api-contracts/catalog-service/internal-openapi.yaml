openapi: 3.0.3
info:
  title: Spotty Catalog Service Internal API
  version: 1.0.0
  description: |
    Service-to-service endpoints of catalog-service (`track-service/`). They live under `/internal/**`,
    which the gateway never routes, and every call must carry the shared service token in `X-Internal-Token`.

    Consumers generate a client from this file (see `api-contracts/README.md`):
    - streaming-service: `GET /internal/tracks/{trackId}` checks that the caller owns the track before an
      upload, and that a track is published before a stream token is issued.
    - library-service: the same call checks that a track exists before a like.

    `publishTrack` is the synchronous stand-in for the `AssetReadySnapshot` consumer (`asyncapi.yaml`) and
    is removed once that consumer is in place.

servers:
  - url: http://catalog-service:8082
    description: catalog-service inside the compose network or the cluster

tags:
  - name: InternalTracks
    description: Track lookups and lifecycle changes for other services.

security:
  - internalToken: []

paths:
  /internal/tracks/{trackId}:
    get:
      tags: [InternalTracks]
      operationId: getTrackInfo
      summary: Owner and status of a track
      description: |
        Returns the track in any status, including drafts that `GET /api/v1/tracks/{trackId}` hides from
        other users, so the caller can apply its own rules.
      parameters:
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: The track.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalTrackInfo'
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'
        '404':
          $ref: '../common/responses.yaml#/NotFound'

  /internal/tracks/{trackId}/publish:
    post:
      tags: [InternalTracks]
      operationId: publishTrack
      summary: Publish a track whose audio is ready
      deprecated: true
      description: |
        Moves the track to `PUBLISHED`, sets `publishedAt` on the first publication and `releaseDate`
        if the artist did not set one. Publishing a published track only updates `durationSeconds`.
        Replaced by consuming `AssetReadySnapshot` from `streaming.asset.ready`.
      parameters:
        - $ref: '#/components/parameters/TrackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishTrackRequest'
      responses:
        '204':
          description: Track published.
        '400':
          $ref: '../common/responses.yaml#/BadRequest'
        '401':
          $ref: '../common/responses.yaml#/Unauthorized'
        '404':
          $ref: '../common/responses.yaml#/NotFound'

components:
  securitySchemes:
    internalToken:
      description: Shared secret of the internal services (`INTERNAL_API_TOKEN`).
      type: apiKey
      in: header
      name: X-Internal-Token

  parameters:
    TrackId:
      name: trackId
      in: path
      required: true
      schema:
        $ref: '../common/schemas.yaml#/Id'

  schemas:
    InternalTrackInfo:
      description: What other services need to authorize actions on a track.
      type: object
      required:
        - id
        - artistId
        - status
      properties:
        id:
          $ref: '../common/schemas.yaml#/Id'
        artistId:
          $ref: '../common/schemas.yaml#/Id'
        status:
          $ref: './openapi.yaml#/components/schemas/TrackStatus'

    PublishTrackRequest:
      type: object
      additionalProperties: false
      required:
        - durationSeconds
      properties:
        durationSeconds:
          description: Length of the transcoded audio.
          type: integer
          format: int32
          minimum: 1
          maximum: 21600
