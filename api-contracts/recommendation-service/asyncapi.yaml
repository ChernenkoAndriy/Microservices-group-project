asyncapi: 3.0.0
info:
  title: Spotty Recommendation Service Events
  version: 1.0.0
  description: |
    Kafka events published and consumed by recommendation-service (Recommendation & Analytics).
    Shared conventions (headers, keys, delivery guarantees) are in `api-contracts/README.md`.

defaultContentType: application/json

servers:
  kafka:
    host: kafka:9092
    protocol: kafka
    description: Kafka inside the compose network or the cluster

channels:
  feedServed:
    address: recommendation.feed.served
    description: |
      A feed was returned by `GET /api/v1/recommendations/me` (Scenario 3). The service consumes its own
      topic, so the response is not delayed by the work: it records the shown tracks as impressions, so
      they are not repeated next session, and prepares the next feed. Keyed by user id.
      Consumers: recommendation-service.
    messages:
      RecommendationsServedEvent:
        $ref: '#/components/messages/RecommendationsServedEvent'

  trackLikes:
    $ref: '../library-service/asyncapi.yaml#/channels/trackLikes'

  trackSnapshots:
    $ref: '../catalog-service/asyncapi.yaml#/channels/trackSnapshots'

operations:
  publishFeedServed:
    action: send
    channel:
      $ref: '#/channels/feedServed'
    summary: Sent right after a feed is returned to the user.
    messages:
      - $ref: '#/channels/feedServed/messages/RecommendationsServedEvent'

  receiveFeedServed:
    action: receive
    channel:
      $ref: '#/channels/feedServed'
    summary: Records impressions and queues the next feed for the user.
    messages:
      - $ref: '#/channels/feedServed/messages/RecommendationsServedEvent'
    bindings:
      kafka:
        groupId:
          type: string
          enum: [recommendation-service]
        bindingVersion: 0.5.0

  receiveTrackLikes:
    action: receive
    channel:
      $ref: '#/channels/trackLikes'
    summary: Updates the user's taste profile and queues a feed recalculation (Scenario 2).
    messages:
      - $ref: '#/channels/trackLikes/messages/TrackLikedEvent'
      - $ref: '#/channels/trackLikes/messages/TrackUnlikedEvent'
    bindings:
      kafka:
        groupId:
          type: string
          enum: [recommendation-service]
        bindingVersion: 0.5.0

  receiveTrackSnapshots:
    action: receive
    channel:
      $ref: '#/channels/trackSnapshots'
    summary: Keeps a local copy of published tracks (artist, genres) to build feeds and charts from.
    messages:
      - $ref: '#/channels/trackSnapshots/messages/TrackSnapshot'
    bindings:
      kafka:
        groupId:
          type: string
          enum: [recommendation-service]
        bindingVersion: 0.5.0

components:
  messages:
    RecommendationsServedEvent:
      name: RecommendationsServedEvent
      title: Recommendations served
      summary: A user was shown a feed. Key is `userId`.
      headers:
        $ref: '../common/events.yaml#/EventHeaders'
      payload:
        $ref: '#/components/schemas/RecommendationsServedEvent'
      bindings:
        kafka:
          key:
            $ref: '../common/events.yaml#/LongKey'
          bindingVersion: 0.5.0

  schemas:
    RecommendationsServedEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - occurredAt
        - userId
        - feedId
        - trackIds
      properties:
        eventId:
          $ref: '../common/events.yaml#/EventId'
        occurredAt:
          $ref: '../common/events.yaml#/OccurredAt'
        userId:
          $ref: '../common/schemas.yaml#/Id'
        feedId:
          $ref: './openapi.yaml#/components/schemas/FeedId'
        trackIds:
          description: The shown tracks, in feed order.
          type: array
          maxItems: 50
          items:
            $ref: '../common/schemas.yaml#/Id'
