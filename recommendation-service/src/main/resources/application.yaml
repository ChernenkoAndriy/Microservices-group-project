server:
  port: ${SERVER_PORT:8084}

spring:
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: recommendation-service
  datasource:
    url: ${CLICKHOUSE_URL:jdbc:ch:http://recommendation-db:8123/spotty_analytics_db}?compress=0
    username: ${CLICKHOUSE_USER:spotty_clickhouse_user}
    password: ${CLICKHOUSE_PASSWORD:your_secure_clickhouse_password}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver

logging:
  # One JSON object per line (logstash format) with the MDC values, so traceId and spanId are fields of every
  # record; otel-collector-logs (k8s/observability) parses them and Grafana links a span to its logs in Loki.
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  # Every trace is recorded; the OpenTelemetry Collector keeps errors and slow traces (tail sampling).
  # Spans are exported only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set (k8s manifests).
  tracing:
    sampling:
      probability: 1.0
  # Metrics stay with Prometheus (scraped from /actuator/prometheus); the OpenTelemetry starter would also push them.
  otlp:
    metrics:
      export:
        enabled: false
  observations:
    annotations:
      enabled: true
